<style>
/* ---- page-specific (protocol member app) ---- */
.btn svg{width:18px;height:18px;flex:0 0 auto}
.app > * {min-width:0}
h1.hello{font-size:22px;margin:2px 2px 0}
.hello-sub{font-size:13px;color:var(--ink-faint);margin:0 2px 14px}
.streak svg{width:15px;height:15px}

.hero > *{position:relative;z-index:1}
.hero .big{font-size:34px;font-weight:800;line-height:1.1;color:#3b2a08}

.hero .week{background:rgba(255,255,255,.35);border-radius:14px;padding:8px 6px}
.hero .week .d{color:#5b4210;font-weight:600}

.hero .week .d.part i{background:#fff;color:var(--gold-deep)}

.timechip{border:0;background:var(--bg-2);color:var(--ink-soft);font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px;cursor:pointer;min-height:28px;display:inline-flex;align-items:center;gap:5px}
.timechip svg{width:12px;height:12px}
.nextcard{display:flex;gap:12px;align-items:center}
.nextcard .b{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--bg-2);filter:grayscale(1);opacity:.8;flex:0 0 auto}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;margin:20px 2px 8px;font-weight:700;font-size:14.5px}

.dayhead.today b{color:var(--gold-deep)}
.weekstrip .d{min-height:56px;background:none;border:0;cursor:pointer;font-family:inherit;padding:0}
.weekstrip .d i{width:100%;max-width:40px;min-height:40px;aspect-ratio:auto;height:40px}
.weekstrip .d b{font-size:11px;font-weight:600}
.axchips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:12px 0 0;scrollbar-width:none}
.axchips .chip{white-space:nowrap;min-height:40px;display:inline-flex;align-items:center;gap:5px}
.calbanner{display:flex;gap:12px;align-items:center;width:100%;text-align:start;cursor:pointer;border:1px dashed var(--gold);background:var(--gold-soft);border-radius:var(--r);padding:12px 14px;color:var(--gold-deep);font-weight:700;margin-top:12px;min-height:56px}

.link{border:0;background:transparent;color:var(--gold-deep);font-weight:700;font-size:13px;cursor:pointer;padding:8px 6px;min-height:40px}
.exrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 6px 6px 10px;margin-top:8px}
.exrow a.main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;padding:8px 6px;min-height:52px}

.backlink svg{width:16px;height:16px;transform:scaleX(-1)}
.pagehead{display:flex;align-items:center;gap:12px;margin:2px 0 6px}
.pagehead .ax{width:44px;height:44px;border-radius:14px;background:var(--gold-soft);display:grid;place-items:center;font-size:22px}
.pagehead h1{font-size:20px}
.inline-confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.copybar{display:flex;gap:8px;align-items:center}
.copybar .input{direction:ltr;text-align:left;font-size:12.5px;min-width:0}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;min-height:48px}
.pill.btnlike{min-height:28px}
.opt{display:flex;gap:8px;flex-wrap:wrap}
.opt .btn{flex:1;min-width:110px;min-height:44px}
.errbox{background:var(--err-soft);color:var(--err);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.okbox{background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* tables inside exercise forms */
.fhint{font-size:12.5px;color:var(--ink-faint);margin:-2px 0 6px}
.trow{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;background:var(--surface-2)}
.trh{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.trh b{font-size:14.5px}.trh small{font-size:12px;color:var(--ink-faint);flex:1;min-width:0}
.tcells{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.tcells .wide{grid-column:1/-1}
.tcells label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:3px}
.tcells .input,.field .input{max-width:none}
.tcells .chips{gap:6px}.tcells .chip{min-height:34px;font-size:12.5px;padding:4px 11px}
.addrowbtn{margin-top:10px}
.tv{padding:4px 0;border-bottom:1px dashed var(--line);font-size:13.5px}.tv:last-child{border:0}
.tv b{font-weight:700}
.exnote{background:var(--gold-soft);color:var(--gold-deep);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;margin-bottom:12px}
/* journey */
.lrow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-top:8px;text-decoration:none;color:inherit;min-height:64px}
.lrow .no{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--bg-2);color:var(--ink-soft);flex:0 0 auto;text-align:center;line-height:1.2}
.lrow.done .no{background:var(--ok-soft);color:var(--ok)}
.lrow .tt{flex:1;min-width:0}.lrow .tt b{display:block;font-size:14.5px}.lrow .tt span{font-size:12px;color:var(--ink-faint)}
.lrow .meter{font-size:12px;color:var(--gold-deep);font-weight:700;white-space:nowrap}
.blk{margin-top:16px}
.blk h3{font-size:15px;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.ach{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-top:8px;min-height:56px}
.ach .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--bg-2);flex:0 0 auto;filter:grayscale(1);opacity:.6}
.ach.got .ic{background:var(--gold-soft);filter:none;opacity:1}
.ach .t{flex:1;min-width:0;font-weight:600;font-size:14px}.ach .t small{display:block;font-weight:500;color:var(--ink-faint);font-size:12px}
.prog{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px;margin-top:8px}
.prog .bar{margin-top:8px}
.rem{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;margin-top:8px;min-height:56px}
.rem .t{flex:1;min-width:0}.rem .t b{display:block;font-size:14px}.rem .t small{color:var(--ink-faint);font-size:12px}
.rem.off{opacity:.55}
.remday{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#f3ecfb,#fbf7ef);border:1px solid #e1d6f0;border-radius:var(--r);padding:12px 14px;margin-top:12px;text-decoration:none;color:inherit}
.remday .ic{font-size:22px}.remday b{display:block;font-size:14.5px;color:#4b3473}.remday small{color:var(--ink-soft);font-size:12.5px}
.topacc{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-soft);text-decoration:none}
.topacc svg{width:20px;height:20px}
.txtbtn{border:0;background:var(--bg-2);color:var(--gold-deep);font-weight:700;font-size:12px;border-radius:99px;padding:3px 10px;min-height:28px;cursor:pointer;font-family:inherit}
.intent{background:var(--surface-2);border-inline-start:3px solid var(--gold);border-radius:8px;padding:12px 14px;font-family:var(--f-quote,inherit);font-size:16px;line-height:1.9}
</style>

<body>
<div class="app" id="app">
  <div class="topbar">
    <div class="brand"><img src="../shared/assets/coin-96.png" alt="شعار لقاء الروح"><div><b>مساعد التناغم</b><span>لقاء الروح</span></div></div>
    <span id="streakTop" style="margin-inline-start:auto"></span><a class="topacc" href="#account" aria-label="حسابي"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg></a>
  </div>
  <div id="roBanner"></div>
  <main id="view" aria-live="polite"></main>
</div>
<nav class="bottomnav" aria-label="التنقل الرئيسي"><div class="in" id="nav"></div></nav>

<script src="../shared/kit.js"></script>
<script src="../shared/content-body.js"></script>
<script src="../shared/data.js"></script>
<script src="../shared/config.js"></script>
<script src="../shared/vendor/supabase-2.45.4.min.js"></script>
<script src="../shared/db-supabase.js"></script>
<script>
(function(){
'use strict';
const {$,$$,esc,fmtDate,fmtShort,fmtTime,dayKey,DAYS,DAYS_SHORT,VOICE,pick,BADGES,I}=Kit;

/* ---------- small utils ---------- */
const mem={};
const store={
  get(k){ try{ const v=localStorage.getItem(k); if(v!==null) return v; }catch(e){} return mem[k]??null; },
  set(k,v){ mem[k]=v; try{ localStorage.setItem(k,v); }catch(e){} }
};
const todayKey=()=>dayKey(new Date());
const addD=(d,n)=>{ const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const pad=n=>String(n).padStart(2,'0');
const ICON={
  flame:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c.6 3.2-1.4 4.6-2.8 6.4C7.6 10.3 6 12.2 6 15a6 6 0 0012 0c0-2.2-1-3.8-2.2-5.2-.3 1.2-.9 2-1.8 2.4.5-3.4-.2-7.4-2-10.2z"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  pencil:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
  calplus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></svg>'
};
const taskWord=n=>n===1?'مهمة':n===2?'مهمتين':'مهام';
const AX={}; (DB.AXES||[]).forEach(a=>AX[a.id]=a);
const axIcon=id=>AX[id]?AX[id].icon:'✦';
const axName=id=>AX[id]?AX[id].name:'';
const axColor=id=>`var(--axis-${id})`;
const dayLabel=key=>{ const t=todayKey(); if(key===t) return 'النهارده'; if(key===dayKey(addD(new Date(),1))) return 'بكرة'; if(key===dayKey(addD(new Date(),-1))) return 'إمبارح'; return Kit.fmtDate(key+'T12:00:00'); };
function pctOf(a,b){ return b?a/b:0; }

/* ---------- data loading + derived stats ---------- */
async function load(){
  const [me,acc,tasksAll,entries,exs,badges,courses,plans]=await Promise.all([DB.me(),DB.access('protocol'),DB.tasks(),DB.entries(),DB.exercises(),DB.badges(),DB.courses(),DB.plans()]);
  const tasks=tasksAll.filter(t=>!t.deleted);
  const state=acc.active?'active':(acc.readOnly?'readonly':'free');
  const byDay={}; tasks.forEach(t=>{ (byDay[dayKey(t.due_at)]=byDay[dayKey(t.due_at)]||[]).push(t); });
  Object.values(byDay).forEach(a=>a.sort((x,y)=>x.due_at.localeCompare(y.due_at)));
  const act=new Set(); tasks.forEach(t=>{ if(t.done_at) act.add(dayKey(t.done_at)); }); entries.forEach(e=>act.add(dayKey(e.created_at)));
  const streak=Kit.streakFrom([...act]);
  let best=0,run=0,prev=null; [...act].sort().forEach(k=>{ if(prev && Kit.daysBetween(prev,k)===1) run++; else run=1; if(run>best) best=run; prev=k; });
  const exMap={}; exs.forEach(x=>exMap[x.id]=x);
  const courseMap={}; courses.forEach(c=>courseMap[c.id]=c);
  if(!CUR) CUR=await DB.curriculum();
  const [achs,runs]=await Promise.all([DB.myAchievements(),DB.programRuns()]);
  const C={me,acc,state,tasks,byDay,entries,exs,exMap,courses,courseMap,badges,plans,streak,best,act,achs,runs,cur:CUR,
    gotAch:id=>achs.some(a=>a.id===id),
    earned:id=>badges.some(b=>b.id===id),
    on:k=>byDay[k]||[],
    stat(k){ const l=byDay[k]||[]; return {total:l.length,done:l.filter(t=>t.done_at).length}; }
  };
  return C;
}
function weekWindow(C,n=7,end=new Date()){ // oldest -> newest
  const out=[]; for(let i=n-1;i>=0;i--){ const d=addD(end,-i); const k=dayKey(d); out.push({d,k,...C.stat(k),entries:C.entries.filter(e=>dayKey(e.created_at)===k).length}); } return out;
}
function weekPct(C){ const w=weekWindow(C); const t=w.reduce((a,x)=>a+x.total,0), d=w.reduce((a,x)=>a+x.done,0); return pctOf(d,t); }

/* ---------- badges ---------- */
async function checkBadges(C){
  const got=[]; const aw=async id=>{ if(!C.earned(id) && await DB.award(id)) got.push(id); };
  if(C.entries.length>=1) await aw('first_entry');
  if(C.plans.length>=1) await aw('first_plan');
  if(C.streak>=7) await aw('streak_7');
  if(C.streak>=30) await aw('streak_30');
  if(C.entries.length>=20) await aw('entries_20');
  const w=weekWindow(C); const axs=new Set(); w.forEach(x=>C.on(x.k).forEach(t=>{ if(t.done_at) axs.add(t.axis); }));
  if(['mind','heart','body','spirit'].every(a=>axs.has(a))) await aw('axes_all');

  try{ (await DB.evalAchievements()).forEach(id=>got.push('ach:'+id)); }catch(e){}

}

const AXMAP={mind:'mind',heart:'heart',body:'body',spirit:'spirit','عقل':'mind','العقل':'mind','ذهن':'mind','مشاعر':'heart','المشاعر':'heart','قلب':'heart','جسد':'body','الجسد':'body','جسم':'body','روح':'spirit','الروح':'spirit','روحي':'spirit'};
function fixJson(s){ return s.replace(/,\s*([\]}])/g,'$1').replace(/'([^'"\n]*)'/g,'"$1"').replace(/([{,]\s*)([A-Za-z_]+)\s*:/g,'$1"$2":'); }
function parsePlan(text){
  let t=String(text||'').replace(/[“”«»]/g,'"').replace(/[‘’]/g,"'").replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
  const fences=[...t.matchAll(/```[a-zA-Z]*\s*([\s\S]*?)```/g)].map(m=>m[1]).filter(s=>s.includes('['));
  const cand=(fences[0]||t);
  const a=cand.indexOf('['), b=cand.lastIndexOf(']');
  let arr=null;
  if(a>-1&&b>a){ const body=cand.slice(a,b+1); for(const s of [body,fixJson(body)]){ try{ const j=JSON.parse(s); if(Array.isArray(j)){ arr=j; break; } }catch(e){} } }
  if(!arr){ const objs=(cand.match(/\{[^{}]*\}/g)||[]); arr=[]; objs.forEach(o=>{ for(const s of [o,fixJson(o)]){ try{ arr.push(JSON.parse(s)); break; }catch(e){} } }); }
  const out=[]; let dropped=0;
  arr.forEach(r=>{
    if(!r||typeof r!=='object'){ dropped++; return; }
    const title=String(r.title??r.task??r.name??r['عنوان']??'').trim();
    const dm=String(r.date??r.day??'').match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
    if(!title||!dm){ dropped++; return; }
    const date=`${dm[1]}-${pad(dm[2])}-${pad(dm[3])}`;
    if(isNaN(new Date(date+'T12:00:00'))){ dropped++; return; }
    const tm=String(r.time??r.at??'').match(/(\d{1,2})[:.](\d{2})/); let time='09:00'; if(tm&&+tm[1]<24&&+tm[2]<60) time=`${pad(tm[1])}:${tm[2]}`;
    const ax=AXMAP[String(r.axis??'').trim().toLowerCase()]||AXMAP[String(r.axis??'').trim()]||'mind';
    let mins=parseInt(r.minutes??r.duration,10); if(!(mins>0)) mins=15; mins=Math.min(mins,240);
    out.push({uid:Math.random().toString(36).slice(2,9),title:title.slice(0,120),axis:ax,date,time,minutes:mins});
  });
  out.sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));
  return {tasks:out,dropped};
}

        return `<div class="exrow"><a class="main" href="#exercise/${x.id}"><span style="min-width:0"><span class="t" style="display:block">${esc(x.title)}</span><span class="m">${es.length?`<span class="num">${es.length}</span> ${es.length===1?'نتيجة':'نتايج'} · آخر مرة ${fmtShort(es[0].created_at)}`:'لسه ما سجّلتش'}</span></span></a><a class="plus" href="#log/${x.id}" aria-label="سجّل: ${esc(x.title)}">${I.plus}</a></div>`; }).join('')}</section>`:''}
      ${pgs.length?`<section class="blk"><h3>🔁 ممارسات بمدة</h3>${pgs.map(pg=>{ const ri=runInfo(C,pg.id); const fin=ri&&ri.done===ri.total;
        return `<div class="prog"><div class="between"><b>${esc(pg.title)}</b><span class="pill ${fin?'ok':ri?'':'mute'}">${fin?'خلّصتها':ri?`<span class="num">${ri.done}/${ri.total}</span>`:`<span class="num">${pg.days}</span> ${pg.days>10?'يوم':'أيام'}`}</span></div>
          <div class="note">${esc(pg.how)}</div>${ri?`<div class="bar"><i style="width:${ri.done/ri.total*100}%"></i></div>`:''}
          <div class="opt" style="margin-top:10px">${ri&&!fin?`<a class="btn soft sm" href="#tasks" style="min-height:42px">في مهامك</a><button type="button" class="btn ghost sm" data-act="stopProg" data-id="${ri.run.id}" style="min-height:42px">وقّفها</button>`:`<button type="button" class="btn sm" data-act="startProg" data-id="${pg.id}" style="min-height:42px">${fin?'ابدأها تاني':'ابدأها'}</button>`}<button type="button" class="btn ghost sm" data-act="progText" data-id="${pg.id}" style="min-height:42px">النص</button></div></div>`; }).join('')}</section>`:''}
      ${la.length?`<section class="blk"><h3>🏅 الإنجازات</h3>${la.map(a=>{ const g=C.achs.find(x=>x.id===a.id);
        return `<div class="ach ${g?'got':''}"><span class="ic" aria-hidden="true">${a.icon}</span><span class="t">${esc(a.title)}<small>${g?`اتعملت ${fmtShort(g.at)}`:esc(achHow(a))}</small></span>${a.how==='manual'?`<button type="button" class="btn ${g?'ghost':'soft'} sm" data-act="achToggle" data-id="${a.id}" data-on="${g?0:1}" style="min-height:40px">${g?'تراجع':'عملتها'}</button>`:''}</div>`; }).join('')}</section>`:''}
      ${allRem.length?`<section class="blk"><h3>🔔 تذكيرات</h3>${d?allRem.map(r=>{ const on=remOn(r.id); if(on===null) return ''; return `<div class="rem ${on?'':'off'}"><span class="t"><b>${esc(r.text)}</b><small>${esc(r.sub||'')}</small></span><button type="button" class="switch ${on?'on':''}" data-act="remToggle" data-id="${r.id}" role="switch" aria-checked="${on}" aria-label="${esc(r.text)}"><i></i></button></div>`; }).join(''):`<div class="note" style="padding:6px 2px">${allRem.length} ${allRem.length>2?'تذكيرات بتتفتح':'تذكير بيتفتح'} لما تخلّص الدرس.</div>`}</section>`:''}`;
  };
  cur.redraw=draw; await draw();
});
A.achToggle=async b=>{ const on=b.dataset.on==='1'; const isNew=await DB.markAchievement(b.dataset.id,on); await cur.redraw();
  if(on&&isNew){ const a=CUR.achievements.find(x=>x.id===b.dataset.id); const C=await load(); const more=await checkBadges(C); await cur.redraw();
    Kit.celebrate({icon:a.icon,title:'إنجاز جديد',body:`${a.title}. ${more.length?'ومعاه: '+more.map(i=>bInfo(i).name).join('، ')+'.':'اتسجّل في رحلتك.'}`,cta:'تمام'}); } };
A.startProg=async b=>{ const pg=CUR.programs.find(p=>p.id===b.dataset.id); const t=dayKey(new Date()), tm=dayKey(addD(new Date(),1));
  Kit.sheet(`<h3>${esc(pg.title)}</h3><p class="note" style="margin:4px 0 12px">${esc(pg.how)} هتنزل في مهامك <span class="num">${pg.days*pg.times.length}</span> مرة.</p>
    <div class="field"><label for="pgStart">تبدأ إمتى؟</label><select class="select" id="pgStart"><option value="${t}">النهارده</option><option value="${tm}">بكره</option></select></div>
    ${pg.times.map((x,i)=>`<div class="field"><label for="pgT${i}">${pg.times.length>1?(i?'المرة التانية':'المرة الأولى'):'الساعة'}</label><input class="input num" type="time" id="pgT${i}" value="${x}"></div>`).join('')}
    <div class="opt"><button type="button" class="btn" data-act="startProgGo" data-id="${pg.id}">ابدأ</button><button type="button" class="btn ghost" data-close>مش دلوقتي</button></div>`); };
A.startProgGo=async b=>{ const pg=CUR.programs.find(p=>p.id===b.dataset.id); const times=pg.times.map((x,i)=>($(`#pgT${i}`)||{}).value||x);
  await DB.startProgram(pg.id,{start:$('#pgStart').value,times}); Kit.closeAll(); await cur.redraw(); Kit.toast(`اتضافت لمهامك: ${pg.days} ${pg.days>10?'يوم':'أيام'} ✓`); };
A.stopProg=async b=>{ await DB.stopProgram(b.dataset.id); await cur.redraw(); Kit.toast('وقّفناها. اللي عملته محفوظ'); };
A.remToggle=async b=>{ await DB.toggleReminder(b.dataset.id); await cur.redraw(); };

/* ===== REMEMBER («تذكّر») ===== */
routes.remember=guard(async (el)=>{
  const draw=async ()=>{
    const C=await load(); await shell(C);
    const rs=await DB.reminders(); const L=C.cur.lessons||[];
    const locked=C.cur.reminders.length-C.cur.reminders.filter(r=>rs.some(x=>x.id===r.id)).length;
    const notif=store.get('sm_notif')!=='0';
    el.innerHTML=`<a class="backlink" href="#journey">${I.arrow} رحلتي</a><h1 class="hello">تذكّر</h1><p class="hello-sub">ممارسات ملهاش مدة. بتفضل معاك، وبيوصلك منها تذكير واحد في اليوم.</p>
      <div class="card"><div class="tgl"><div><b>إشعار يومي هادي</b><div class="note">تذكير واحد في اليوم، بالدور. ولو قفلته، بيظهر لك أول ما تفتح التطبيق.</div></div><button type="button" class="switch ${notif?'on':''}" data-act="toggleNotif" role="switch" aria-checked="${notif}" aria-label="إشعار يومي"><i></i></button></div></div>
      ${rs.length?L.filter(l=>rs.some(r=>r.lesson===l.id)).map(l=>`<div class="note" style="margin:16px 4px 2px;font-weight:700;color:var(--gold-deep)">${esc(l.no)} · ${esc(l.title)}</div>${rs.filter(r=>r.lesson===l.id).map(r=>`<div class="rem ${r.on?'':'off'}"><span class="t"><b>${esc(r.text)}</b><small>${esc(r.sub||'')}</small></span><button type="button" class="switch ${r.on?'on':''}" data-act="remToggle" data-id="${r.id}" role="switch" aria-checked="${r.on}" aria-label="${esc(r.text)}"><i></i></button></div>`).join('')}`).join('')
        :`<div class="card empty"><div class="big">🔔</div><p>التذكيرات بتتفتح مع الدروس. خلّص الدرس الأول وهتلاقي أول تلاتة هنا.</p><a class="btn soft" href="${ACADEMY}">روح للأكاديمية</a></div>`}
      ${locked?`<p class="note" style="margin:14px 4px">و<span class="num">${locked}</span> تذكير كمان بيتفتحوا مع الدروس الجاية.</p>`:''}`;
  };
  cur.redraw=draw; await draw();
});

/* ===== PROGRESS ===== */
routes.progress=guard(async (el)=>{
  const draw=async ()=>{
    const C=await load(); await shell(C);
    const w=weekWindow(C); const weekDone=w.reduce((a,x)=>a+x.done,0);
    const vals=w.map(x=>x.done), labels=w.map(x=>DAYS_SHORT[x.d.getDay()]);
    const axEnt=C.entries.find(e=>e.exercise_id==='ex_axes'); // latest first
    const av=axEnt&&axEnt.data&&axEnt.data.axes;
    const window14=weekWindow(C,14); const cnt={mind:0,heart:0,body:0,spirit:0}; window14.forEach(x=>C.on(x.k).forEach(t=>{ if(t.done_at&&cnt[t.axis]!==undefined) cnt[t.axis]++; }));
    const mx=Math.max(1,...Object.values(cnt));
    const tiles=[['أيام متواصلة',C.streak,'تقدّم اليوم بيحافظ عليها'],['إنجازات الرحلة',`${C.achs.length}/${C.cur.achievements.length}`,''],['مهام الأسبوع',weekDone,'اتقفلت'],['نتايج في ملفي',C.entries.length,'تمرين']];
    const hw=C.entries.filter(e=>e.exercise_id==='ex_hawkins'&&e.data&&e.data.level).slice(0,7).reverse();
    el.innerHTML=`<h1 class="hello">التقدّم</h1><p class="hello-sub">شوف قد إيه وصلت — من غير مقارنة بحد.</p>
      <div class="grid2">${tiles.map(([l,v,s])=>`<div class="stat"><small>${l}</small><b class="num">${v}</b> <span class="note">${s.length>12?'':s}</span></div>`).join('')}</div>
      <div class="section-title">مستوى وعيك (مقياس هوكنز)</div>
      <div class="card">${hw.length?`${Kit.barChart(hw.map(e=>+e.data.level),hw.map(e=>fmtShort(e.created_at).split(' ')[0]+'/'+(new Date(e.created_at).getMonth()+1)),{height:140,max:Math.max(600,...hw.map(e=>+e.data.level))})}<div class="note" style="text-align:center">آخر قياس: <b class="num">${hw[hw.length-1].data.level}</b>${+hw[hw.length-1].data.level>=200?' · فوق خط الشجاعة (200)':''}</div>`:`<div class="empty" style="padding:10px"><p>قيس وعيك قبل الجلسة وبعدها، وهيظهر هنا بيتحرك إزاي.</p><a class="btn soft" href="#log/ex_hawkins">سجّل قياس</a></div>`}</div>
      <div class="section-title">مهام اتقفلت — آخر 7 أيام</div>
      <div class="card">${Kit.barChart(vals,labels,{height:130})}</div>
      <div class="section-title">محاور حياتك</div>
      <div class="card">${av?`<div style="display:flex;justify-content:center">${Kit.radar((DB.AXES||[]).map(a=>(av[a.id]||0)/10),(DB.AXES||[]).map(a=>a.name),230)}</div><div class="note" style="text-align:center">آخر تقييم: ${fmtShort(axEnt.created_at)}</div>`:`<div class="empty" style="padding:10px"><p>سجّل تمرين «محاور الحياة الأربعة» وهيظهر هنا شكل توازنك.</p><a class="btn soft" href="#log/ex_axes">سجّل دلوقتي</a></div>`}
        <div class="divider"></div><div class="note" style="margin-bottom:8px;font-weight:700">توازن مهامك المنجزة (آخر 14 يوم)</div>
        <div class="axbal">${(DB.AXES||[]).map(a=>`<div class="r"><span>${a.icon} ${a.name}</span><div class="bar"><i style="--c:${axColor(a.id)};width:${cnt[a.id]/mx*100}%"></i></div><b class="num">${cnt[a.id]}</b></div>`).join('')}</div></div>
      <div class="section-title">الأوسمة <small class="num">${C.badges.length} / ${BADGES.length}</small></div>
      <div class="card"><div class="badges">${BADGES.map(b=>{ const e=C.badges.find(x=>x.id===b.id); return `<button type="button" class="badge ${e?'':'locked'}" data-act="badgeInfo" data-id="${b.id}" aria-label="${esc(b.name)} — ${e?'مكتسب':'مقفول'}"><span class="b">${e?b.icon:'🔒'}</span><span>${esc(b.name)}</span></button>`; }).join('')}</div></div>`;
  };
  cur.redraw=draw; await draw();
});
A.badgeInfo=async b=>{ const C=await load(); const info=bInfo(b.dataset.id); const e=C.badges.find(x=>x.id===info.id);
  Kit.toast(e?`${info.name}: اتفتح في ${fmtShort(e.at)}`:`${info.name}: ${info.hint}`,3200); };

/* ===== ACCOUNT ===== */
routes.account=guard(async (el)=>{
  const draw=async ()=>{
    const C=await load(); await shell(C); const a=C.acc;
    const pill=C.state==='active'?'<span class="pill ok">فعّال</span>':C.state==='readonly'?'<span class="pill warn">منتهي — للقراءة</span>':'<span class="pill mute">مجاني</span>';
    const notif=store.get('sm_notif')!=='0';
    el.innerHTML=`<h1 class="hello">حسابي</h1><p class="hello-sub">${esc(C.me.name||'')} · <span class="num" style="display:inline-block">${esc(C.me.email||'')}</span></p>
      <div class="card"><div class="between"><b>اشتراك مساعد التناغم</b>${pill}</div>
        ${C.state==='active'?`<p class="muted" style="margin:8px 0 0">ساري لحد <b>${fmtDate(a.endsAt)}</b> — فاضل <b class="num">${a.daysLeft}</b> يوم.</p>`
        :C.state==='readonly'?`<p class="muted" style="margin:8px 0 0">انتهى بتاريخ ${fmtDate(a.endsAt)}. ملفك ومهامك القديمة محفوظين وتقدر تسجّل تمارين جديدة. الخطة والمجتمع بيرجعوا مع التجديد.</p>`
        :`<p class="muted" style="margin:8px 0 0">انت دلوقتي في المرحلة المجانية: تسجّل تمارينك وتشوف ملفك. الخطة والمهام الذكية بتتفتح مع الاشتراك.</p>`}
        <div class="divider"></div>
        <div class="note" style="margin-bottom:8px"><b>التجديد:</b> ربع سنوي (90 يوم) أو سنوي (365 يوم)، وكلاهما يشمل المجتمع.</div>
        <a class="btn ${C.state==='active'?'soft':''}" href="https://wa.me/200000000000" target="_blank" rel="noopener" style="min-height:46px">تواصل للتجديد</a></div>
      ${C.state==='active'?`<div class="card"><div class="between"><div><b>مجتمع لقاء الروح</b><div class="note">مساحة هادية مع ناس ماشيين في نفس الطريق.</div></div><a class="btn sm" href="https://chat.whatsapp.com/PLACEHOLDER" target="_blank" rel="noopener" style="min-height:44px">افتح</a></div></div>`:''}
      <div class="card"><div class="tgl"><div><b>تذكير يومي هادي</b><div class="note">إشعار واحد في اليوم بمهامك (قريبًا).</div></div><button type="button" class="switch ${notif?'on':''}" data-act="toggleNotif" role="switch" aria-checked="${notif}" aria-label="تذكير يومي"><i></i></button></div></div>
      <div class="section-title">الخصوصية</div>
      <div class="card"><p class="muted" style="margin:0 0 10px">بياناتك ملكك. تقدر تاخد نسخة منها أو تمسحها وقت ما تحب.</p>
        <div class="opt"><button type="button" class="btn soft" data-act="exportData">صدّر بياناتي</button>
        ${delAsk==='all'?`<button type="button" class="btn danger" data-act="wipeData">أكيد، امسح كل حاجة</button><button type="button" class="btn ghost" data-act="wipeAsk" data-v="0">تراجع</button>`:`<button type="button" class="btn danger" data-act="wipeAsk" data-v="1">امسح بياناتي</button>`}</div></div>
      ${DB.mode==='supabase'?'':`<div class="section-title">معاينة الحالات (للمراجعة فقط)</div>
      <div class="card" style="border-style:dashed"><div class="opt">
        <button type="button" class="btn ghost" data-act="demo" data-k="paid">مشترك فعّال</button>
        <button type="button" class="btn ghost" data-act="demo" data-k="free">مجاني</button>
        <button type="button" class="btn ghost" data-act="demo" data-k="expired">منتهي</button></div>
        <button type="button" class="btn ghost block" data-act="demoReset" style="margin-top:8px">إعادة ضبط البيانات التجريبية</button></div>`}
      ${DB.mode==='supabase'?`<button type="button" class="btn ghost block" data-act="signOut" style="margin-top:16px">تسجيل الخروج</button>`:''}`;
  };
  cur.redraw=draw; delAsk=null; await draw();
});
A.toggleNotif=async()=>{ store.set('sm_notif',store.get('sm_notif')==='0'?'1':'0'); await cur.redraw(); };
A.demo=b=>{ try{ DB.setDemoUser(b.dataset.k); }catch(e){} };
A.demoReset=()=>DB.resetDemo();
A.signOut=()=>DB.signOut();
A.wipeAsk=async b=>{ delAsk=b.dataset.v==='1'?'all':null; await cur.redraw(); };
A.wipeData=async()=>{ const C=await load(); for(const e of C.entries) await DB.deleteEntry(e.id); for(const t of C.tasks) await DB.updateTask(t.id,{deleted:true,done_at:null}); delAsk=null; Kit.toast('اتمسحت بياناتك'); await cur.redraw(); };
A.exportData=async()=>{
  const C=await load();
  const data={exported_at:new Date().toISOString(),user:{name:C.me.name,email:C.me.email},
    entries:C.entries.map(e=>({exercise:(C.exMap[e.exercise_id]||{}).title||e.exercise_id,date:e.created_at,data:e.data})),
    tasks:C.tasks.map(t=>({title:t.title,axis:t.axis,due_at:t.due_at,minutes:t.minutes,done_at:t.done_at})),
    plans:C.plans.map(p=>({summary:p.summary,created_at:p.created_at})),badges:C.badges};
  Kit.sheet(`<h3>بياناتك</h3><p class="muted" style="margin:4px 0 10px">انسخ النص ده واحتفظ بيه في مكان أمان.</p>
    <textarea class="textarea code" id="exportJson" readonly aria-label="بياناتك بصيغة JSON" style="min-height:220px">${esc(JSON.stringify(data,null,2))}</textarea>
    <div class="opt" style="margin-top:10px"><button type="button" class="btn" data-act="copyExport">${I.copy} نسخ</button><button type="button" class="btn ghost" data-close>إغلاق</button></div>`);
};
A.copyExport=()=>Kit.copyText($('#exportJson').value);

/* ---------- boot ---------- */
(async function boot(){
  try{ const C=await load(); await shell(C); }catch(e){ console.error(e); }
  Kit.router(routes,view,'today');
  addEventListener('hashchange',()=>{ syncNav(); const sh=$('#kitSheet'); if(sh&&sh.classList.contains('on')){ sh.classList.remove('on'); const sc=$('#kitScrim'); if(sc) sc.classList.remove('on'); } }); syncNav();
  $$('#nav [data-go]').forEach(()=>{});
})();
})();
</script>
</body>
</html>
