<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لوحة مساعد التناغم</title>
<meta name="theme-color" content="#f7f2e8">
<link rel="icon" href="../shared/assets/coin-96.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/kit.css">
<style>
  /* ---- page-local additions (nothing here duplicates the kit) ---- */
  .admin .head .sub{font-size:13px;color:var(--ink-faint);margin-top:2px}
  .admin .head .acts{display:flex;gap:8px;flex-wrap:wrap}
  .admin .nav button svg{width:19px;height:19px;flex:0 0 auto}
  .side .who{margin-top:18px;padding:12px;border:1px dashed var(--line-strong);border-radius:12px;font-size:12.5px;color:var(--ink-soft);line-height:1.7}
  .side .who b{color:var(--gold-deep)}
  .admin-mtop{position:sticky;top:0;z-index:60;align-items:center;gap:10px;background:rgba(247,242,232,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:8px 14px}
  .admin-mtop .iconbtn{min-width:44px;min-height:44px;justify-content:center}
  .admin-mtop .iconbtn svg{width:22px;height:22px}
  .admin-mtop b{color:var(--gold-deep);font-size:16px}
  .mscrim{position:fixed;inset:0;background:rgba(50,38,12,.42);z-index:65;opacity:0;pointer-events:none;transition:opacity .25s}
  .mscrim.on{opacity:1;pointer-events:auto}
  .foot{margin-top:34px;text-align:center;font-size:12px;color:var(--ink-faint)}

  .kpi b{display:block;line-height:1.3;margin-top:2px}
  .kpi small .dotk{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px;background:var(--gold)}
  .cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
  .panel h2{font-size:16px;margin-bottom:2px}
  .panel .psub{font-size:12.5px;color:var(--ink-faint);margin-bottom:12px}
  .handrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .handrow:last-child{border-bottom:0}
  .avatar{width:38px;height:38px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold-deep);font-weight:800;font-size:15px}
  .handrow .tx{flex:1;min-width:0}
  .handrow .tx b{display:block;font-size:14px}
  .handrow .tx span{font-size:12.5px;color:var(--ink-faint)}
  .seg{display:inline-flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
  .seg button{border:0;background:transparent;border-radius:8px;padding:5px 11px;font-size:12.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;min-height:32px}
  .seg button.on{background:var(--surface);color:var(--gold-deep);box-shadow:var(--shadow)}
  .cbar{display:flex;align-items:center;gap:10px;font-size:13px;margin:10px 0}
  .cbar span:first-child{flex:0 0 120px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cbar .bar{flex:1}
  .cbar .num{flex:0 0 40px;text-align:end;font-weight:700;color:var(--gold-deep)}

  .btn,.iconbtn,.chip{min-height:40px}
  .btn svg,.iconbtn svg{width:17px;height:17px;flex:0 0 auto}
  .btn{white-space:nowrap}
  .btn.sm{min-height:36px}
  .tbl td .btn.sm,.tbl td .iconbtn{min-height:36px}
  .tbl .name{font-weight:700}
  .tbl .sub{font-size:12px;color:var(--ink-faint);display:block}
  .tbl tr.click{cursor:pointer}
  .tbl .fit{width:1%;white-space:nowrap}

  /* exercise builder */
  .builder{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:16px;align-items:start}
  .builder .prev{position:sticky;top:16px}
  .fcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
  .fcard .fh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .fcard .fh .idx{width:26px;height:26px;border-radius:8px;background:var(--gold-soft);color:var(--gold-deep);font-weight:800;font-size:13px;display:grid;place-items:center;flex:0 0 auto}
  .fcard .fh .select{flex:1;min-width:0;padding:7px 10px;font-size:14px}
  .fcard .tools{display:flex;gap:4px}
  .tbtn{width:40px;height:40px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:10px;cursor:pointer;display:grid;place-items:center;font-size:16px;line-height:1;transition:all .2s}
  .tbtn:hover:not([disabled]){border-color:var(--gold);color:var(--gold-deep)}
  .tbtn.del:hover{border-color:#e3c2bf;color:var(--err)}
  .tbtn[disabled]{opacity:.35;cursor:default}
  .tbtn svg{width:17px;height:17px}
  .fcard .field{margin-bottom:10px}
  .fcard .field:last-child{margin-bottom:0}
  .fcard .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .fcard .hint{font-size:12px;color:var(--ink-faint)}
  .check{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--ink-soft)}
  .addrow{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
  .addrow .btn{flex:0 0 auto}
  .phone{max-width:340px;margin:0 auto;background:#fff;border:8px solid #2c2720;border-radius:34px;box-shadow:0 24px 40px -22px rgba(50,38,12,.6);overflow:hidden}
  .phone .scr{background:var(--bg);padding:16px 14px 18px;min-height:220px}
  .phone .notch{height:5px;width:70px;border-radius:99px;background:#2c2720;margin:0 auto 10px;opacity:.9}
  .phone .ptitle{font-weight:800;color:var(--gold-deep);font-size:16px;margin:2px 2px 4px}
  .phone .ptag{font-size:11px;color:var(--ink-faint);margin:0 2px 12px}
  .phone .fld{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
  .phone .fld .field{margin:0}
  .phone .fld .textarea{min-height:70px}
  .phone .scale{flex-wrap:wrap}
  .phone .scale button{min-width:30px;padding:7px 0;min-height:36px}
  .phone .axrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .phone .axrow:last-child{margin-bottom:0}
  .phone .axrow .ai{flex:0 0 66px;font-size:12.5px;font-weight:700;color:var(--ink-soft);display:flex;align-items:center;gap:4px}
  .phone .axrow .scale{flex:1;gap:3px}
  .phone .axrow .scale button{min-width:0;padding:5px 0;font-size:11px;min-height:30px}
  .phone .savebtn{margin-top:4px}
  .pbadge{display:inline-flex;font-size:11px;font-weight:700;color:var(--ink-faint);margin-bottom:8px}

  /* notification mockup */
  .nphone{max-width:320px;margin:0 auto;border-radius:30px;padding:26px 14px 28px;background:linear-gradient(160deg,#4a3b24,#241c10);box-shadow:0 24px 40px -22px rgba(50,38,12,.7)}
  .nphone .clock{text-align:center;color:#fff;font-size:42px;font-weight:300;line-height:1.1}
  .nphone .date{text-align:center;color:rgba(255,255,255,.7);font-size:12px;margin-bottom:18px}
  .notif{background:rgba(255,255,255,.92);border-radius:18px;padding:11px 12px;display:flex;gap:10px;align-items:flex-start;backdrop-filter:blur(8px)}
  .notif img{width:36px;height:36px;border-radius:9px;flex:0 0 auto}
  .notif .nt{flex:1;min-width:0}
  .notif .nh{display:flex;justify-content:space-between;font-size:11px;color:#6f6658;gap:8px}
  .notif .nt b{display:block;font-size:13.5px;color:#2c2720;line-height:1.5;word-break:break-word}
  .notif .nt p{margin:0;font-size:12.5px;color:#4a4236;line-height:1.55;word-break:break-word}
  .notif + .notif{margin-top:8px;opacity:.55;transform:scale(.96)}

  .mcard{display:flex;align-items:flex-start;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
  .mcard:last-child{border-bottom:0;padding-bottom:0}
  .mcard:first-child{padding-top:0}
  .mcard .mt{flex:1;min-width:0}
  .mcard .mt b{display:block;font-size:14.5px}
  .mcard .mt p{margin:2px 0 6px;font-size:13px;color:var(--ink-soft)}
  .mcard .meta{display:flex;flex-wrap:wrap;gap:6px}
  .mcard .side2{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .radios{display:flex;gap:8px;flex-wrap:wrap}
  .radios .chip{flex:1;text-align:center}

  .bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .bcard{display:flex;gap:14px;align-items:center}
  .bcard .badge{flex:0 0 auto}
  .bcard .bt{flex:1;min-width:0}
  .bcard .bt b{display:block}
  .bcard .rule{font-size:12.5px;color:var(--ink-soft);margin:1px 0 6px}
  .bcard .cnt{font-size:12px;color:var(--ink-faint);display:flex;justify-content:space-between;margin-top:4px}

  .drawer h3{font-size:19px}
  .drawer .kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}
  .drawer .kv .stat b{font-size:19px}
  .ent{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
  .ent:last-child{border-bottom:0}
  .ent .e1{flex:1;min-width:140px}
  .ent .e1 b{display:block;font-size:14px}
  .ent .e1 span{font-size:12.5px;color:var(--ink-faint)}
  .lock{display:flex;gap:8px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.8px;color:var(--ink-soft)}
  .lock svg{width:18px;height:18px;flex:0 0 auto;color:var(--gold-deep);margin-top:3px}

  @media(max-width:1100px){
    .builder{grid-template-columns:1fr}
    .builder .prev{position:static}
    .cols{grid-template-columns:1fr}
  }
  @media(max-width:560px){
    .admin .head h1{font-size:19px}
    .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
    .kpi b{font-size:22px}
    .fcard .two{grid-template-columns:1fr}
    .cbar span:first-child{flex-basis:90px}
    .drawer .kv{grid-template-columns:repeat(3,minmax(0,1fr))}
    .toolbar .input{max-width:none;flex:1 1 100%}
    .mcard{flex-wrap:wrap}
    .head .acts .btn{flex:1}
  }
</style>
</head>
<body>
<div class="admin">
  <aside class="side" id="side" aria-label="القائمة">
    <div class="brand"><img src="../shared/assets/coin.png" alt="شعار لقاء الروح"><div><b>لقاء الروح</b><span>PROTOCOL · ADMIN</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="who"><b>مساحة الإدارة</b><br>الأعداد والنشاط فقط. محتوى تمارين الأعضاء خاص بيهم ومش بيظهر هنا أبدًا.</div>
  </aside>
  <div class="mscrim" id="mscrim"></div>
  <div style="min-width:0">
    <div class="admin-mtop"><button class="iconbtn" id="menuBtn" aria-label="فتح القائمة" aria-expanded="false"></button><b>لوحة مساعد التناغم</b></div>
    <main class="main" id="view" aria-live="polite"></main>
  </div>
</div>

<script src="../shared/kit.js"></script>
<script src="../shared/content-body.js"></script>
<script src="../shared/data.js"></script>
<script src="../shared/config.js"></script>
<script src="../shared/vendor/supabase-2.45.4.min.js"></script>
<script src="../shared/db-supabase.js"></script>
<script>
(function(){
  const {$, $$, esc, I, toast, sheet, closeAll} = Kit;
  const A = DB.admin;
  const view = $('#view');
  const AX = DB.AXES;
  const axisOf = id => AX.find(a=>a.id===id);
  const DAY = 864e5;

  /* ---------- helpers ---------- */
  const num = n => `<span class="num">${n}</span>`;
  const initial = n => esc((n||'؟').trim().charAt(0));
  const daysSince = iso => iso ? Math.floor((Date.now()-new Date(iso))/DAY) : null;
  function seenText(iso){
    const d = daysSince(iso);
    if(d===null) return 'لسه ما دخلش';
    if(d<=0) return 'النهارده';
    if(d===1) return 'أمس';
    return `قبل ${num(d)} أيام`;
  }
  function pstate(u){
    const p = u.protocol;
    if(p.active){
      if(p.daysLeft!==null && p.daysLeft<=7) return {k:'expiring', label:'قرّب ينتهي', cls:'warn'};
      return {k:'active', label:'نشط', cls:'ok'};
    }
    if(p.readOnly) return {k:'readonly', label:'قراءة فقط', cls:'mute'};
    return {k:'free', label:'مجاني', cls:''};
  }
  const AUD = {
    all:'كل الأعضاء', protocol_active:'مشتركو المساعد النشطون', expiring_7d:'اللي اشتراكهم هيخلص خلال 7 أيام',
    read_only:'أعضاء القراءة فقط', free:'الأعضاء المجانيون'
  };
  const audOptions = sel => Object.entries(AUD).map(([k,v])=>`<option value="${k}" ${k===sel?'selected':''}>${v}</option>`).join('');
  function audCount(aud, users){
    const m = users.filter(u=>u.role!=='admin');
    const f = {all:()=>true, protocol_active:u=>u.protocol.active, expiring_7d:u=>u.protocol.active&&u.protocol.daysLeft!==null&&u.protocol.daysLeft<=7,
      read_only:u=>u.protocol.readOnly, free:u=>!u.protocol.has}[aud] || (()=>true);
    return m.filter(f).length;
  }
  const SPACE = {protocol:'مساعد التناغم', community:'المجتمع'};
  const spaceName = (s, courses) => SPACE[s] || (s.startsWith('course:') ? 'كورس: '+((courses.find(c=>c.id===s.slice(7))||{}).title||s.slice(7)) : s);
  function schedText(s){
    if(!s) return '—';
    const m = /^daily (\d\d:\d\d)$/.exec(s);
    if(m) return `يوميًا ${m[1]}`;
    if(s==='auto') return 'تلقائي قبل الانتهاء';
    const d = new Date(s); if(!isNaN(d)) return `${Kit.fmtShort(d)} · ${Kit.fmtTime(d)}`;
    return esc(s);
  }
  const pageHead = (title, sub, acts='') => `<div class="head"><div><h1>${title}</h1>${sub?`<div class="sub">${sub}</div>`:''}</div><div class="acts">${acts}</div></div>`;
  const footer = () => `<div class="foot">المحتوى الحالي تجريبي</div>`;

  /* ---------- shell: nav + mobile drawer ---------- */
  const NAV = [
    ['overview','نظرة عامة',I.chart], ['exercises','التمارين',I.file], ['members','المشتركين',I.users],
    ['messages','الرسائل والتذكيرات',I.bell], ['badges','الأوسمة',I.spark]
  ];
  $('#nav').innerHTML = NAV.map(([k,t,ic])=>`<button data-r="${k}" type="button">${ic}<span>${t}</span></button>`).join('');
  $('#menuBtn').innerHTML = I.menu;
  const side = $('#side'), mscrim = $('#mscrim'), menuBtn = $('#menuBtn');
  function setDrawer(open){ side.classList.toggle('open',open); mscrim.classList.toggle('on',open); menuBtn.setAttribute('aria-expanded',open); }
  menuBtn.addEventListener('click',()=>setDrawer(!side.classList.contains('open')));
  mscrim.addEventListener('click',()=>setDrawer(false));
  $('#nav').addEventListener('click',e=>{ const b=e.target.closest('[data-r]'); if(!b) return; location.hash = b.dataset.r; setDrawer(false); });
  function markNav(){ const p=(location.hash.slice(1)||'overview').split('/')[0]; const cur = p==='exercise'?'exercises':p;
    $$('#nav [data-r]').forEach(b=>{ b.classList.toggle('on', b.dataset.r===cur); if(b.dataset.r===cur) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); }); }
  addEventListener('hashchange',()=>{ markNav(); setDrawer(false); closeAll(); });

  /* async-safe route wrapper */
  let tok = 0, goRoute = ()=>{};
  const R = fn => (host, rest) => { const t=++tok; const alive=()=>t===tok; const el=document.createElement('div'); host.appendChild(el); return Promise.resolve(fn(el, rest, alive)).catch(err=>{ console.error(err); el.innerHTML='<div class="empty"><div class="big">🌿</div><p>حصلت مشكلة في التحميل. جرّب تحدّث الصفحة.</p></div>'; }); };

  /* ============================================================
     OVERVIEW
     ============================================================ */
  let handDays = 2;
  async function overview(el, _, alive){
    const [m, users, courses] = await Promise.all([A.metrics(), A.users(), A.courses()]);
    if(!alive()) return;
    const paint = () => {
      const needs = users.filter(u=>u.role!=='admin' && u.protocol.active && (daysSince(u.last_seen)===null || daysSince(u.last_seen)>=handDays))
        .sort((a,b)=>(daysSince(b.last_seen)??99)-(daysSince(a.last_seen)??99));
      $('#handBody').innerHTML = needs.length ? needs.map(u=>`
        <div class="handrow"><span class="avatar">${initial(u.name)}</span>
          <div class="tx"><b>${esc(u.name)}</b><span>آخر دخول: ${seenText(u.last_seen)}</span></div>
          <button class="btn soft sm" data-open="${u.id}" type="button">فتح الملف</button></div>`).join('')
        : `<div class="empty"><div class="big">🌿</div><p>كل المشتركين النشطين حاضرين الفترة دي. حلو جدًا.</p></div>`;
      $$('#handSeg button').forEach(b=>b.classList.toggle('on', +b.dataset.d===handDays));
      $('#handHint').textContent = `مشتركون نشطون ما دخلوش من ${handDays} أيام أو أكتر. رسالة لطيفة ممكن تفرق معاهم.`;
    };
    el.innerHTML = pageHead('نظرة عامة','صورة سريعة عن حال المشتركين والنشاط الأسبوعي') + `
      <div class="kpis">
        <div class="kpi"><small>مشتركون نشطون</small><b class="num">${m.protocolActive}</b></div>
        <div class="kpi"><small>اشتراكهم هيخلص خلال 7 أيام</small><b class="num">${m.expiring7}</b></div>
        <div class="kpi"><small>قراءة فقط</small><b class="num">${m.readOnly}</b></div>
        <div class="kpi"><small>تمارين مسجّلة هذا الأسبوع</small><b class="num">${m.entriesThisWeek}</b></div>
        <div class="kpi"><small>نسبة إنجاز المهام</small><b class="num">${Math.round(m.tasksDoneRate*100)}%</b></div>
      </div>
      <div class="cols">
        <section class="panel"><h2>النشاط الأسبوعي</h2><div class="psub">عدد الأعضاء النشطين في كل أسبوع</div>${Kit.barChart(m.weeklyActive, m.weeklyLabels, {height:170})}</section>
        <section class="panel"><div class="between" style="align-items:flex-start;flex-wrap:wrap"><div><h2>ممكن يحتاجوا إيد</h2><div class="psub" id="handHint"></div></div>
          <div class="seg" id="handSeg" role="group" aria-label="مدة الغياب">${[2,3,7].map(d=>`<button type="button" data-d="${d}">${num(d)} أيام</button>`).join('')}</div></div>
          <div id="handBody"></div></section>
      </div>
      <section class="panel" style="margin-top:14px"><h2>إنجاز الدروس لكل كورس</h2><div class="psub">نسبة متوسطة، من غير أي تفاصيل شخصية</div>
        ${Object.entries(m.lessonCompletion).map(([id,v])=>`<div class="cbar"><span>${esc((courses.find(c=>c.id===id)||{}).title||id)}</span><div class="bar"><i style="width:${Math.round(v*100)}%"></i></div><span class="num">${Math.round(v*100)}%</span></div>`).join('')}
      </section>` + footer();
    paint();
    el.addEventListener('click', e=>{
      const d = e.target.closest('#handSeg [data-d]'); if(d){ handDays=+d.dataset.d; paint(); return; }
      const o = e.target.closest('[data-open]'); if(o) openMember(o.dataset.open);
    });
  }

  /* ============================================================
     EXERCISES — list
     ============================================================ */
  async function exercises(el, _, alive){
    const [list, courses, entries] = await Promise.all([A.exercises(), A.courses(), DB.entries()]);
    if(!alive()) return;
    const cnt = id => entries.filter(e=>e.exercise_id===id).length;
    const rows = list.map(x=>{
      const ax = axisOf(x.axis);
      return `<tr class="click" data-go="${esc(x.id)}">
        <td><span class="name">${esc(x.title)}</span>${x.lesson?' <span class="pill mute">من المنهج</span>':''}</td>
        <td>${esc((courses.find(c=>c.id===x.source)||{}).title||'—')}</td>
        <td>${ax?`<span class="pill">${ax.icon} ${ax.name}</span>`:'<span class="pill mute">كل المحاور</span>'}</td>
        <td class="num">${x.fields.length}</td><td class="num">${cnt(x.id)}</td>
        <td class="fit"><button class="btn soft sm" type="button" data-go="${esc(x.id)}">${x.lesson?'عرض':'تعديل'}</button></td></tr>`;
    }).join('');
    el.innerHTML = pageHead('التمارين', 'قوالب التمارين اللي بيسجّل عليها الأعضاء في ملفهم', `<button class="btn" type="button" data-go="new">${I.plus} تمرين جديد</button>`) + `

     EXERCISE EDITOR + field builder + live preview
     ============================================================ */
  const TYPES = [['text','نص قصير'],['textarea','نص طويل'],['number','رقم'],['scale','مقياس'],['chips','اختيارات'],['axes','محاور الحياة الأربعة']];
  const rid = () => 'f_'+Math.random().toString(36).slice(2,7);
  const optList = f => (f.optionsText||'').split('\n').map(s=>s.trim()).filter(Boolean);
  function toDraft(x){
    return {id:x.id||null, title:x.title||'', source:x.source||'', axis:x.axis||'', fields:(x.fields||[]).map(f=>({...f, optionsText:(f.options||[]).join('\n')}))};
  }
  function newField(type='text'){
    const f = {key:rid(), type, label: type==='axes'?'قيّم كل محور النهارده من 1 لـ 10':''};
    if(type==='scale'){ f.min=1; f.max=5; }
    if(type==='chips'){ f.optionsText=''; f.multi=false; }
    return f;
  }
  /* member-facing form markup (same kit classes the member app uses) */
  function previewForm(d){
    const flds = d.fields.map(f=>{
      const lab = esc(f.label||'(بدون عنوان)');
      let body='';
      if(f.type==='text') body=`<input class="input" type="text" aria-label="${lab}">`;
      else if(f.type==='textarea') body=`<textarea class="textarea" aria-label="${lab}"></textarea>`;
      else if(f.type==='number') body=`<input class="input num" type="number" inputmode="decimal" aria-label="${lab}">`;
      else if(f.type==='scale'){ let mn=+f.min, mx=+f.max; if(isNaN(mn)) mn=1; if(isNaN(mx)||mx<=mn) mx=mn+4; mx=Math.min(mx,mn+20);
        body=`<div class="scale" data-scale>${Array.from({length:mx-mn+1},(_,i)=>`<button type="button" data-v="${mn+i}">${mn+i}</button>`).join('')}</div>`; }
      else if(f.type==='chips'){ const o=optList(f); body = o.length ? `<div class="chips" data-chips="${f.multi?'multi':'single'}">${o.map(t=>`<button type="button" class="chip">${esc(t)}</button>`).join('')}</div>${f.multi?'<span class="note">تقدر تختار أكتر من واحدة</span>':''}` : '<span class="note">ضيف خيارات علشان تظهر هنا</span>'; }
      else if(f.type==='axes') body = AX.map(a=>`<div class="axrow"><span class="ai"><span aria-hidden="true">${a.icon}</span>${a.name}</span><div class="scale" data-scale>${Array.from({length:10},(_,i)=>`<button type="button" data-v="${i+1}">${i+1}</button>`).join('')}</div></div>`).join('');
      return `<div class="fld"><div class="field"><label>${lab}</label>${body}</div></div>`;
    }).join('');
    return `<div class="phone"><div class="scr"><div class="notch"></div>
      <div class="ptitle">${esc(d.title||'عنوان التمرين')}</div><div class="ptag">${d.axis&&axisOf(d.axis)?axisOf(d.axis).icon+' '+axisOf(d.axis).name+' · ':''}سجّل جديد</div>
      ${flds || '<div class="fld"><span class="note">ضيف أول حقل من القايمة جنبك</span></div>'}
      <button class="btn block savebtn" type="button" tabindex="-1">${'احفظ في ملفي'}</button></div></div>`;
  }

              <div class="field" style="margin-bottom:0"><label for="xAxis">المحور</label><select id="xAxis" class="select"><option value="">كل المحاور</option>${AX.map(a=>`<option value="${a.id}">${a.icon} ${a.name}</option>`).join('')}</select></div>

      if(e.target.closest('[data-del]')){ d.fields.splice(i,1); drawFields(); toast('اتشال الحقل'); }

    const remHtml = rem.map(m=>`<div class="mcard" data-m="${m.id}">
        <div class="mt"><b>${esc(m.title)}</b><p>${esc(m.body)}</p><div class="meta"><span class="pill">${AUD[m.audience]||esc(m.audience)}</span><span class="pill mute">${schedText(m.schedule)}</span></div></div>
        <div class="side2"><button class="switch ${m.active?'on':''}" type="button" role="switch" aria-checked="${!!m.active}" aria-label="تفعيل التذكير: ${esc(m.title)}" data-sw><i></i></button>
        <button class="btn soft sm" type="button" data-edit>تعديل</button></div></div>`).join('');
    const broHtml = bro.length ? bro.map(m=>{ const sent = m.sent_at && new Date(m.sent_at) <= new Date(); const when = m.sent_at||m.schedule;
      return `<div class="mcard"><div class="mt"><b>${esc(m.title)}</b><p>${esc(m.body)}</p><div class="meta"><span class="pill">${AUD[m.audience]||esc(m.audience)}</span>
        <span class="pill ${sent?'ok':'warn'}">${sent?'اتبعتت':'مجدولة'} · ${schedText(when)}</span>${m.opened!=null?`<span class="pill mute">فتحها <span class="num">${m.opened}%</span></span>`:''}</div></div></div>`; }).join('')
      : '<p class="note">لسه ما بعتّش رسايل جماعية.</p>';

    el.innerHTML = pageHead('الرسائل والتذكيرات','تذكيرات تلقائية رقيقة، ورسايل جماعية لما تحب تطمّن على حد') + `
      <section class="panel"><h2>التذكيرات التلقائية</h2><div class="psub">بتظهر للعضو مرة واحدة ويقدر يقفلها. من غير إلحاح.</div>${remHtml}</section>
      <div class="section-title">رسالة جماعية جديدة</div>
      <div class="cols">
        <section class="panel">
          <div class="field"><label for="bTitle">العنوان</label><input id="bTitle" class="input" maxlength="60" placeholder="مثال: أمسية جديدة يوم الخميس"></div>
          <div class="field"><label for="bBody">نص الرسالة</label><textarea id="bBody" class="textarea" maxlength="180" style="min-height:90px" placeholder="جملة أو اتنين، بنبرة دافية"></textarea></div>
          <div class="field"><label for="bAud">مين يستلمها</label><select id="bAud" class="select">${audOptions('all')}</select><span class="note" id="bCount"></span></div>
          <div class="field"><label>التوقيت</label><div class="radios" role="group" aria-label="التوقيت"><button type="button" class="chip on" data-when="now">ابعت دلوقتي</button><button type="button" class="chip" data-when="later">جدولة</button></div></div>
          <div class="field" id="bWhenWrap" hidden><label for="bWhen">التاريخ والوقت</label><input id="bWhen" class="input num" type="datetime-local"></div>
          <button class="btn block" type="button" id="bSend">${I.send} <span id="bSendTxt">ابعت الرسالة</span></button>
          <p class="note" style="margin-top:10px">الإرسال الفعلي بيتم عن طريق OneSignal بعد ما يتوصّل. لحد وقتها الرسالة بتتسجّل هنا وبتبقى جاهزة.</p>
        </section>
        <section class="panel"><h2>معاينة الإشعار</h2><div class="psub">شكله على موبايل العضو</div>
          <div class="nphone"><div class="clock">9:41</div><div class="date">${Kit.fmtDate(new Date())}</div>
            <div class="notif"><img src="../shared/assets/coin-96.png" alt="أيقونة التطبيق"><div class="nt"><div class="nh"><span>لقاء الروح</span><span>الآن</span></div><b id="pvT"></b><p id="pvB"></p></div></div>
            <div class="notif"><img src="../shared/assets/coin-96.png" alt=""><div class="nt"><div class="nh"><span>لقاء الروح</span><span>أمس</span></div><b>تمرين النهارده مستنيك</b></div></div></div></section>
      </div>
      <div class="section-title">الرسايل الجماعية السابقة</div>
      <section class="panel">${broHtml}</section>` + footer();

    /* reminder actions */
    $$('.mcard[data-m]').forEach(card=>{
      const m = rem.find(x=>x.id===card.dataset.m);
      $('[data-sw]',card).addEventListener('click', async e=>{ const sw=e.currentTarget; const on=!sw.classList.contains('on'); sw.classList.toggle('on',on); sw.setAttribute('aria-checked',on);
        await A.saveMessage({id:m.id, active:on}); m.active=on; toast(on?'التذكير شغّال':'التذكير متوقف'); });
      $('[data-edit]',card).addEventListener('click',()=>editReminder(m));
    });
    /* composer */
    const T=$('#bTitle'), B=$('#bBody'), AU=$('#bAud'); let when='now';
    const upd = () => { $('#pvT').textContent = T.value.trim() || 'عنوان الرسالة'; $('#pvB').textContent = B.value.trim() || 'نص الرسالة هيظهر هنا زي ما هيوصل للعضو.';
      const n=audCount(AU.value, users); $('#bCount').innerHTML = `تقريبًا ${num(n)} عضو`; };
    [T,B].forEach(x=>x.addEventListener('input',upd)); AU.addEventListener('change',upd); upd();
    $$('[data-when]',el).forEach(b=>b.addEventListener('click',()=>{ when=b.dataset.when; $$('[data-when]',el).forEach(c=>c.classList.toggle('on',c===b));
      $('#bWhenWrap').hidden = when!=='later'; $('#bSendTxt').textContent = when==='later'?'جدولة الرسالة':'ابعت الرسالة';
      if(when==='later' && !$('#bWhen').value){ const d=new Date(Date.now()+DAY); d.setHours(18,0,0,0); const p=n=>String(n).padStart(2,'0'); $('#bWhen').value=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; } }));
    $('#bSend').addEventListener('click', async ()=>{
      const title=T.value.trim(), body=B.value.trim();
      if(!title||!body){ toast('اكتب العنوان والنص الأول'); (title?B:T).focus(); return; }
      let sched;
      if(when==='later'){ const v=$('#bWhen').value; if(!v){ toast('اختار موعد الإرسال'); return; } const dt=new Date(v); if(dt<=new Date()){ toast('الموعد لازم يكون في المستقبل'); return; } sched=dt.toISOString(); }
      else sched=new Date().toISOString();
      await A.saveMessage({kind:'broadcast', title, body, audience:AU.value, schedule:sched, active:false, sent_at:sched, opened:when==='later'?null:0});
      toast(when==='later'?'اتجدولت الرسالة ✓':'اتسجّلت الرسالة وجاهزة للإرسال ✓');
      messages(el,null,alive);
    });
  }
  function editReminder(m){
    const dm = /^daily (\d\d:\d\d)$/.exec(m.schedule||'');
    const s = sheet(`<h3 style="color:var(--gold-deep);margin-bottom:12px">تعديل التذكير</h3>
      <div class="field"><label for="rT">العنوان</label><input id="rT" class="input" maxlength="60" value="${esc(m.title)}"></div>
      <div class="field"><label for="rB">النص</label><textarea id="rB" class="textarea" maxlength="180" style="min-height:80px">${esc(m.body)}</textarea></div>
      <div class="field"><label for="rA">الجمهور</label><select id="rA" class="select">${audOptions(m.audience)}</select></div>
      ${dm?`<div class="field"><label for="rS">الوقت اليومي</label><input id="rS" class="input num" type="time" value="${dm[1]}"></div>`:`<p class="note">توقيت الإرسال: ${schedText(m.schedule)}</p>`}
      <div class="row" style="justify-content:flex-end"><button class="btn ghost" type="button" data-close>إلغاء</button><button class="btn" type="button" id="rSave">حفظ</button></div>`);
    $$('[data-close]',s).forEach(b=>b.addEventListener('click',closeAll));
    $('#rSave',s).addEventListener('click', async ()=>{
      const title=$('#rT',s).value.trim(), body=$('#rB',s).value.trim(); if(!title||!body){ toast('العنوان والنص مطلوبين'); return; }
      const patch={id:m.id, title, body, audience:$('#rA',s).value}; if(dm && $('#rS',s).value) patch.schedule='daily '+$('#rS',s).value;
      await A.saveMessage(patch); closeAll(); toast('اتحفظ التذكير ✓'); goRoute();
    });
  }

  /* ============================================================
     BADGES
     ============================================================ */
  const RULES = {
    first_entry:'بيتمنح أول ما العضو يسجّل نتيجة أول تمرين في ملفه.',
    first_plan:'بيتمنح لما العضو يحوّل ملفه لخطة ويضيفها لمهامه.',
    day_done:'بيتمنح لما العضو يخلّص كل مهام يوم كامل.',
    streak_7:'7 أيام متواصلة فيها مهمة أو تمرين على الأقل.',
    streak_30:'30 يوم متواصلين فيهم نشاط يومي.',
    course_done:'بيتمنح عند إنهاء كل دروس كورس.',
    axes_all:'مهام في المحاور الأربعة (عقل، مشاعر، جسد، روح) خلال أسبوع واحد.',
    entries_20:'لما يوصل ملف العضو لـ 20 تمرين مسجّل.'
  };
  const EARNED = {first_entry:.92, first_plan:.64, day_done:.78, streak_7:.41, streak_30:.09, course_done:.27, axes_all:.35, entries_20:.18};
  async function badges(el, _, alive){
    const users = (await A.users()).filter(u=>u.role!=='admin');
    if(!alive()) return;
    const total = users.length;
    el.innerHTML = pageHead('الأوسمة','الأوسمة بتتمنح تلقائيًا وفق قواعد ثابتة. للعرض فقط.') + `<div class="bgrid">${Kit.BADGES.map(b=>{
      const pc = EARNED[b.id]||0, n = Math.round(pc*total);
      return `<div class="card bcard"><div class="badge"><span class="b" aria-hidden="true">${b.icon}</span></div>
        <div class="bt"><b>${esc(b.name)}</b><div class="rule">${esc(RULES[b.id]||b.hint)}</div><div class="bar"><i style="width:${Math.round(pc*100)}%"></i></div>
        <div class="cnt"><span><span class="num">${n}</span> من <span class="num">${total}</span> عضو</span><span class="num">${Math.round(pc*100)}%</span></div></div></div>`; }).join('')}</div>
      <p class="note" style="margin-top:12px">الأرقام تقديرية في النسخة التجريبية.</p>` + footer();
  }

  /* ---------- go ---------- */
  markNav();
  goRoute = Kit.router({
    overview:R(overview), exercises:R(exercises), exercise:R(editor), members:R(members), messages:R(messages), badges:R(badges)
  }, view, 'overview');
})();
</script>
</body>
</html>
